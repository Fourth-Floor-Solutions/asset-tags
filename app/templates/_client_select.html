<select id="client_id" name="client_id" required>
  <option value="">Choose a client…</option>
  {% for c in clients %}
  <option value="{{ c.id }}" data-internal="{{ c.is_internal }}" {{ 'selected' if sel_client|string == c.id|string }}>{{ c.name }}{% if c.label_name != c.name %} — “{{ c.label_name }}”{% endif %}</option>
  {% endfor %}
</select>
